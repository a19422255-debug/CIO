<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Pilih paket jasa CIO Creative In One."
    >

    <title>Pilih Paket — CIO Creative</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           ORDER PACKAGE PAGE
        ===================================================== */

        .order-package-container {
            position: relative;
            z-index: 3;

            width: min(92%, 900px);

            margin: 0 auto;

            padding: 15px 0 50px;
        }


        .order-package-title {
            margin: 25px auto 35px;

            text-align: center;
        }


        .order-package-title .small-title {
            color: #9aa7b8;

            font-size: 11px;

            letter-spacing: 2px;
        }


        .order-package-title h1 {
            margin-top: 7px;

            color: #f5f1e8;

            font-size: clamp(28px, 5vw, 38px);
        }


        .order-package-title h1 span {
            color: #d4af37;
        }


        .order-package-title p {
            margin-top: 9px;

            color: #aeb9c8;

            font-size: 13px;
        }


        /* =====================================================
           PACKAGE GRID
        ===================================================== */

        .new-package-grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 18px;

        }


        .new-package-card {

            position: relative;

            display: flex;

            flex-direction: column;

            min-height: 300px;

            padding: 22px;

            border:
                1px solid
                rgba(212, 175, 55, .28);

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #0d2b4d,
                    #071a32
                );

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, .25);

            text-decoration: none;

            overflow: hidden;

            transition:
                transform .25s ease,
                border-color .25s ease,
                box-shadow .25s ease;

        }


        .new-package-card::before {

            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            top: -65px;
            right: -65px;

            border-radius: 50%;

            border:
                1px solid
                rgba(212, 175, 55, .18);

        }


        .new-package-card:hover {

            transform: translateY(-6px);

            border-color: #d4af37;

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, .35);

        }


        /* =====================================================
           ICON
        ===================================================== */

        .new-package-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .new-package-icon {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 58px;
            height: 58px;

            border-radius: 15px;

            background: #061a32;

            border:
                1px solid
                rgba(212, 175, 55, .35);

            font-size: 27px;

        }


        .new-package-arrow {

            color: #d4af37;

            font-size: 23px;

        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .new-package-content {

            margin-top: 25px;

        }


        .new-package-label {

            color: #d4af37;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 2px;

        }


        .new-package-name {

            margin-top: 6px;

            color: #f5f1e8;

            font-size: 22px;

        }


        .new-package-price {

            margin-top: 13px;

            color: #d4af37;

            font-size: 23px;

            font-weight: 700;

        }


        .new-package-description {

            margin-top: 9px;

            color: #9aa7b8;

            font-size: 11px;

            line-height: 1.6;

        }


        .new-package-detail {

            margin-top: 5px;

            color: #718095;

            font-size: 10px;

            line-height: 1.5;

        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .new-package-button {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: auto;

            padding-top: 22px;

            color: #f5f1e8;

            font-size: 11px;

            font-weight: 700;

        }


        .new-package-button span:last-child {

            color: #d4af37;

            font-size: 17px;

        }


        /* =====================================================
           BACK
        ===================================================== */

        .new-package-back {

            display: block;

            width: fit-content;

            margin: 25px auto 0;

            color: #d4af37;

            font-size: 12px;

            text-decoration: none;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 720px) {

            .new-package-grid {

                grid-template-columns: 1fr;

                gap: 14px;

            }


            .new-package-card {

                min-height: 0;

                padding: 20px;

            }


            .new-package-content {

                margin-top: 19px;

            }


            .new-package-button {

                margin-top: 20px;

            }

        }


        @media (max-width: 420px) {

            .order-package-container {

                width: 91%;

            }


            .order-package-title {

                margin-bottom: 25px;

            }


            .new-package-card {

                padding: 18px;

                border-radius: 17px;

            }


            .new-package-icon {

                width: 52px;

                height: 52px;

                font-size: 24px;

            }


            .new-package-name {

                font-size: 20px;

            }


            .new-package-price {

                font-size: 21px;

            }

        }

    </style>

</head>


<body>

<div class="page package-page">


    <!-- ORNAMEN -->

    <div class="package-orb package-orb-one"></div>

    <div class="package-orb package-orb-two"></div>

    <div class="package-star package-star-one">
        ✦
    </div>

    <div class="package-star package-star-two">
        ✧
    </div>

    <div class="package-star package-star-three">
        ✦
    </div>


    <!-- HEADER -->

    <header class="header">

        <img
            src="logo-cio.png.jpeg"
            alt="Logo CIO Creative In One"
            class="logo"
        >

    </header>


    <!-- CONTENT -->

    <main class="order-package-container">


        <!-- BADGE -->

        <div class="home-badge">

            <span>✦</span>

            CIO CREATIVE

            <span>✦</span>

        </div>


        <!-- TITLE -->

        <section class="order-package-title">

            <p class="small-title">
                PILIH PAKET
            </p>

            <h1 id="serviceTitle">
                Edit <span>Video</span>
            </h1>

            <p>
                Pilih paket yang sesuai dengan kebutuhanmu.
            </p>

        </section>


        <!-- PACKAGE GRID -->

        <section
            class="new-package-grid"
            id="packageGrid"
        >

        </section>


        <!-- BACK -->

        <a
            href="pesan.html"
            class="new-package-back"
        >
            ← Kembali ke Pilih Jasa
        </a>


    </main>


    <!-- FOOTER -->

    <footer>

        <span>✦</span>

        CIO — Creative In One

        <span>✦</span>

    </footer>


</div>


<script>

/* =========================================================
   AMBIL JASA DARI URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const jasa =
    params.get("jasa") || "video";


/* =========================================================
   DATA
========================================================= */

const data = {

    video: {

        name: "Edit Video",

        icon: "🎬",

        prices: {

            Basic: "Rp20.000",

            Standard: "Rp30.000",

            Premium: "Rp45.000"

        },

        descriptions: {

            Basic:
                "Edit video sederhana dan rapi.",

            Standard:
                "Edit video lebih lengkap dan menarik.",

            Premium:
                "Edit video lebih detail dan profesional."

        },

        details: {

            Basic:
                "Maksimal 1 menit.",

            Standard:
                "Maksimal 3 menit.",

            Premium:
                "Maksimal 5 menit."

        }

    },


    foto: {

        name: "Edit Foto",

        icon: "📷",

        prices: {

            Basic: "Rp15.000",

            Standard: "Rp25.000",

            Premium: "Rp35.000"

        },

        descriptions: {

            Basic:
                "Edit foto sederhana dan rapi.",

            Standard:
                "Edit foto lebih lengkap.",

            Premium:
                "Edit foto lebih detail."

        },

        details: {

            Basic:
                "Warna dan pencahayaan.",

            Standard:
                "Retouch dan peningkatan kualitas.",

            Premium:
                "Retouch, warna, dan detail."

        }

    },


    ppt: {

        name: "PPT",

        icon: "📊",

        prices: {

            Basic: "Rp20.000",

            Standard: "Rp30.000",

            Premium: "Rp45.000"

        },

        descriptions: {

            Basic:
                "PPT sederhana dan rapi.",

            Standard:
                "PPT lebih menarik dan modern.",

            Premium:
                "PPT lengkap dengan desain detail."

        },

        details: {

            Basic:
                "Desain dasar.",

            Standard:
                "Desain lebih lengkap.",

            Premium:
                "Visual dan layout lebih detail."

        }

    },


    poster: {

        name: "Poster",

        icon: "🎨",

        prices: {

            Basic: "Rp15.000",

            Standard: "Rp25.000",

            Premium: "Rp35.000"

        },

        descriptions: {

            Basic:
                "Poster sederhana.",

            Standard:
                "Poster lebih menarik.",

            Premium:
                "Poster lebih detail dan kreatif."

        },

        details: {

            Basic:
                "Desain dasar.",

            Standard:
                "Desain lebih lengkap.",

            Premium:
                "Desain detail sesuai kebutuhan."

        }

    }

};


const service =
    data[jasa] || data.video;


/* =========================================================
   TITLE
========================================================= */

document.getElementById(
    "serviceTitle"
).innerHTML =
    service.icon +
    " " +
    service.name;


/* =========================================================
   PACKAGE
========================================================= */

const packageGrid =
    document.getElementById(
        "packageGrid"
    );


const packageNames = [
    "Basic",
    "Standard",
    "Premium"
];


packageNames.forEach(
    (packageName) => {

        const card =
            document.createElement("a");


        card.className =
            "new-package-card";


        card.href =
            "order-form.html?jasa=" +
            encodeURIComponent(jasa) +
            "&paket=" +
            encodeURIComponent(packageName);


        card.innerHTML = `

            <div class="new-package-top">

                <div class="new-package-icon">
                    ${service.icon}
                </div>

                <div class="new-package-arrow">
                    →
                </div>

            </div>


            <div class="new-package-content">

                <span class="new-package-label">
                    PAKET
                </span>

                <h2 class="new-package-name">
                    ${packageName}
                </h2>

                <div class="new-package-price">
                    ${service.prices[packageName]}
                </div>

                <p class="new-package-description">
                    ${service.descriptions[packageName]}
                </p>

                <p class="new-package-detail">
                    ${service.details[packageName]}
                </p>

            </div>


            <div class="new-package-button">

                <span>
                    Pilih Paket
                </span>

                <span>
                    →
                </span>

            </div>

        `;


        packageGrid.appendChild(card);

    }
);

</script>

</body>

</html>
