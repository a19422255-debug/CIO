<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Order jasa CIO Creative In One."
    >

    <title>Order — CIO Creative</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="page package-page">


    <!-- ORNAMEN -->

    <div class="package-orb package-orb-one"></div>
    <div class="package-orb package-orb-two"></div>

    <div class="package-star package-star-one">
        ✦
    </div>

    <div class="package-star package-star-two">
        ✧
    </div>

    <div class="package-star package-star-three">
        ✦
    </div>


    <!-- HEADER -->

    <header class="header">

        <img
            src="logo-cio.png.jpeg"
            alt="Logo CIO Creative In One"
            class="logo"
        >

    </header>


    <!-- CONTENT -->

    <main class="package-container">


        <div class="package-badge">

            <span>✦</span>

            CIO CREATIVE

            <span>✦</span>

        </div>


        <section class="package-title">

            <p class="package-subtitle">
                PILIH LAYANAN
            </p>

            <h1 id="serviceTitle">
                Order Jasa
            </h1>

            <p>
                Pilih paket yang sesuai dengan kebutuhanmu.
            </p>

        </section>


        <!-- PACKAGE GRID -->

        <section
            class="package-grid"
            id="packageGrid"
        >
        </section>


        <!-- BACK -->

        <a
            href="pesan.html"
            class="package-back"
        >

            ← Kembali ke Pilih Jasa

        </a>


    </main>


    <!-- FOOTER -->

    <footer>

        <span>✦</span>

        CIO — Creative In One

        <span>✦</span>

    </footer>


</div>


<script>

const params = new URLSearchParams(window.location.search);

const jasa = params.get("jasa") || "video";


const data = {

    video: {

        title: "Edit Video",

        icon: "🎬",

        packages: [

            {
                name: "Basic",
                price: "Rp20.000",
                description: "Edit video sederhana.",
                detail: "Video maksimal 1 menit."
            },

            {
                name: "Standard",
                price: "Rp30.000",
                description: "Edit video lebih lengkap.",
                detail: "Video maksimal 3 menit."
            },

            {
                name: "Premium",
                price: "Rp45.000",
                description: "Edit video lebih detail.",
                detail: "Video maksimal 5 menit."
            }

        ]

    },


    foto: {

        title: "Edit Foto",

        icon: "📷",

        packages: [

            {
                name: "Basic",
                price: "Rp15.000",
                description: "Edit foto sederhana.",
                detail: "Warna, crop, dan pencahayaan."
            },

            {
                name: "Standard",
                price: "Rp25.000",
                description: "Edit foto lebih lengkap.",
                detail: "Retouch dan peningkatan kualitas."
            },

            {
                name: "Premium",
                price: "Rp35.000",
                description: "Edit foto lebih detail.",
                detail: "Retouch, warna, dan detail."
            }

        ]

    },


    ppt: {

        title: "PPT",

        icon: "📊",

        packages: [

            {
                name: "Basic",
                price: "Rp20.000",
                description: "PPT sederhana dan rapi.",
                detail: "Desain dasar dan penataan isi."
            },

            {
                name: "Standard",
                price: "Rp30.000",
                description: "PPT lebih menarik.",
                detail: "Desain lebih lengkap dan modern."
            },

            {
                name: "Premium",
                price: "Rp45.000",
                description: "PPT profesional dan detail.",
                detail: "Desain lengkap dengan visual."
            }

        ]

    },


    poster: {

        title: "Poster",

        icon: "🎨",

        packages: [

            {
                name: "Basic",
                price: "Rp15.000",
                description: "Poster sederhana.",
                detail: "Desain dasar sesuai brief."
            },

            {
                name: "Standard",
                price: "Rp25.000",
                description: "Poster lebih menarik.",
                detail: "Desain lebih detail dan kreatif."
            },

            {
                name: "Premium",
                price: "Rp35.000",
                description: "Poster lebih profesional.",
                detail: "Desain detail sesuai kebutuhan."
            }

        ]

    }

};


const service = data[jasa] || data.video;


document.getElementById("serviceTitle").textContent =
    service.title;


const grid = document.getElementById("packageGrid");


service.packages.forEach((item) => {

    const card = document.createElement("a");

    card.className = "package-card";

    card.href =
        "order-form.html?jasa=" +
        encodeURIComponent(jasa) +
        "&paket=" +
        encodeURIComponent(item.name);


    card.innerHTML = `

        <div class="package-card-top">

            <div class="package-icon">
                ${service.icon}
            </div>

            <div class="package-arrow">
                →
            </div>

        </div>


        <div class="package-card-content">

            <span class="package-label">
                PAKET
            </span>

            <h2>
                ${item.name}
            </h2>

            <div class="package-price">
                ${item.price}
            </div>

            <p>
                ${item.description}
            </p>

            <p>
                ${item.detail}
            </p>

        </div>

    `;


    grid.appendChild(card);

});

</script>


</body>

</html>
