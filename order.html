
<script>
    /* =========================================
       BACA DATA DARI LINK
    ========================================= */

    const params = new URLSearchParams(
        window.location.search
    );

    const jasa =
        params.get("jasa") || "Jasa";

    const paket =
        params.get("paket") || "Paket";

    const harga =
        params.get("harga") || "-";


    /* =========================================
       TAMPILKAN DATA PAKET
    ========================================= */

    document.getElementById("serviceName")
        .textContent = jasa;

    document.getElementById("packageName")
        .textContent = paket;

    document.getElementById("packagePrice")
        .textContent = harga;


    /* =========================================
       FORM → WHATSAPP CEO
    ========================================= */

    document.getElementById("orderForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const nama =
                document.getElementById("nama")
                    .value
                    .trim();

            const whatsapp =
                document.getElementById("whatsapp")
                    .value
                    .trim();

            const catatan =
                document.getElementById("catatan")
                    .value
                    .trim();


            /* NOMOR WHATSAPP CEO CIO */

            const nomorCIO = "6285645045260";


            /* PESAN OTOMATIS */

            const pesan =
`Halo CIO Creative In One 👋

Saya ingin memesan jasa:

Jasa: ${jasa}
Paket: ${paket}
Harga: ${harga}

Nama: ${nama}
Nomor WhatsApp: ${whatsapp}

Detail Pesanan:
${catatan}

Terima kasih 🙏`;


            /* LINK WHATSAPP */

            const whatsappURL =
                "https://wa.me/" +
                nomorCIO +
                "?text=" +
                encodeURIComponent(pesan);


            /* BUKA WHATSAPP */

            window.location.href = whatsappURL;

        });
</script>
