
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pilih Paket — CIO Creative</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="page package-page">


        <!-- ORNAMEN -->

        <div class="package-orb package-orb-one"></div>

        <div class="package-orb package-orb-two"></div>

        <div class="package-star package-star-one">
            ✦
        </div>

        <div class="package-star package-star-two">
            ✧
        </div>

        <div class="package-star package-star-three">
            ✦
        </div>



        <!-- HEADER -->

        <header class="header">

            <a href="index.html">

                <img
                    src="logo-cio.png.jpeg"
                    alt="CIO Creative In One"
                    class="logo"
                >

            </a>

        </header>



        <!-- CONTENT -->

        <main class="package-container">


            <div class="package-badge">

                <span>✦</span>

                CIO CREATIVE

                <span>✦</span>

            </div>



            <div class="package-title">

                <p class="package-subtitle">
                    Kamu memilih
                </p>

                <h1 id="serviceTitle">
                    Pilih Paket
                </h1>

                <p>
                    Pilih paket yang sesuai
                    dengan kebutuhanmu.
                </p>

            </div>



            <!-- PAKET -->

            <div
                class="package-grid"
                id="packageGrid"
            ></div>



            <!-- KEMBALI -->

            <a
                href="pesan.html"
                class="package-back"
            >
                ← Kembali ke Pilih Jasa
            </a>


        </main>



        <!-- FOOTER -->

        <footer>

            <span>✦</span>

            CIO — Creative In One

            <span>✦</span>

        </footer>


    </div>



<script>


/* =========================================
   AMBIL JASA
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const jasa =
    params.get("jasa") || "video";



/* =========================================
   DATA PAKET CIO
========================================= */

const packages = {


    /* =====================================
       VIDEO
    ===================================== */

    video: {

        title: "Edit Video",

        icon: "🎬",

        items: [

            {
                name: "Video Pendek",

                price: "Rp25.000",

                desc:
                    "Maks. 30 detik • Cutting, musik, teks sederhana, dan transisi dasar",

                duration:
                    "Estimasi: 1 hari"
            },


            {
                name: "Basic",

                price: "Rp40.000",

                desc:
                    "Maks. 60 detik • Cutting, musik, teks, transisi, SFX sederhana, dan color correction",

                duration:
                    "Estimasi: 1–2 hari"
            },


            {
                name: "Standard",

                price: "Rp70.000",

                desc:
                    "Maks. 2 menit • Subtitle, beat sync, SFX, color grading, dan transisi lebih detail",

                duration:
                    "Estimasi: 2–3 hari"
            },


            {
                name: "Premium",

                price: "Rp100.000",

                desc:
                    "Maks. 3 menit • Sound design, color grading detail, serta efek dan transisi kompleks",

                duration:
                    "Estimasi: 3–4 hari"
            }

        ]

    },



    /* =====================================
       FOTO
    ===================================== */

    foto: {

        title: "Edit Foto",

        icon: "📷",

        items: [

            {
                name: "Basic",

                price: "Rp25.000",

                desc:
                    "Per foto • Crop, resize, brightness, contrast, saturation, dan basic color correction",

                duration:
                    "Estimasi: 1 hari"
            },


            {
                name: "Standard",

                price: "Rp40.000",

                desc:
                    "Per foto • Retouch wajah ringan, remove objek sederhana, background cleanup, dan color grading",

                duration:
                    "Estimasi: 1–2 hari"
            },


            {
                name: "Premium",

                price: "Rp70.000",

                desc:
                    "Per foto • Manipulasi foto, penggantian background, retouch detail, compositing, dan efek kreatif",

                duration:
                    "Estimasi: 2–3 hari"
            }

        ]

    },



    /* =====================================
       PPT
    ===================================== */

    ppt: {

        title: "PPT / Dokumen",

        icon: "📊",

        items: [

            {
                name: "Basic",

                price: "Rp5.000/slide",

                desc:
                    "Layout rapi, font, warna, gambar, icon, dan template sederhana",

                duration:
                    "Estimasi: 1–2 hari"
            },


            {
                name: "Standard",

                price: "Rp10.000/slide",

                desc:
                    "Custom layout, infographic sederhana, icon, diagram, tabel, dan transisi",

                duration:
                    "Estimasi: 2–4 hari"
            },


            {
                name: "Premium",

                price: "Rp20.000/slide",

                desc:
                    "Custom design, infographic kompleks, animasi, motion, diagram, dan visual storytelling",

                duration:
                    "Estimasi: 4–7 hari"
            }

        ]

    },



    /* =====================================
       POSTER
    ===================================== */

    poster: {

        title: "Poster / Pamflet",

        icon: "🎨",

        items: [

            {
                name: "Basic",

                price: "Rp30.000",

                desc:
                    "Layout sederhana, teks, foto, warna, dan beberapa elemen grafis",

                duration:
                    "Estimasi: 1–2 hari"
            },


            {
                name: "Standard",

                price: "Rp60.000",

                desc:
                    "Desain custom, typography, icon, shape, color grading, dan layout profesional",

                duration:
                    "Estimasi: 2–3 hari"
            },


            {
                name: "Premium",

                price: "Rp100.000",

                desc:
                    "Konsep custom, manipulasi foto, ilustrasi/elemen kompleks, visual hierarchy, dan detail tinggi",

                duration:
                    "Estimasi: 3–5 hari"
            }

        ]

    }

};



/* =========================================
   TAMPILKAN JASA
========================================= */

const selected =
    packages[jasa] || packages.video;


document.getElementById(
    "serviceTitle"
).textContent =
    selected.icon +
    " " +
    selected.title;



const packageGrid =
    document.getElementById(
        "packageGrid"
    );



/* =========================================
   BUAT KARTU PAKET
========================================= */

selected.items.forEach(
    function(item) {


        const card =
            document.createElement("a");


        card.className =
            "package-card";


        /*
         * Harga dikirim ke halaman detail
         * agar sistem lama tetap bisa
         * membaca parameter harga.
         */

        card.href =
            "detail.html" +
            "?jasa=" +
            encodeURIComponent(jasa) +
            "&paket=" +
            encodeURIComponent(item.name) +
            "&harga=" +
            encodeURIComponent(item.price);



        card.innerHTML = `

            <div class="package-icon">
                ${selected.icon}
            </div>


            <div class="package-label">
                PAKET
            </div>


            <h2>
                ${item.name}
            </h2>


            <div class="package-price">
                ${item.price}
            </div>


            <p>
                ${item.desc}
            </p>


            <small
                style="
                    display:block;
                    margin-top:10px;
                    opacity:0.7;
                "
            >
                ${item.duration}
            </small>


            <div class="package-select">
                Pilih Paket →
            </div>

        `;


        packageGrid.appendChild(card);

    }
);

</script>


</body>

</html>
```
