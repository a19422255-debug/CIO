<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CIO Creative In One — layanan kreatif untuk video, foto, PPT, dan poster."
    >

    <title>CIO — Creative In One</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="page home-page">

    <!-- ORNAMEN -->
    <div class="home-orb home-orb-one"></div>
    <div class="home-orb home-orb-two"></div>

    <div class="home-star home-star-one">✦</div>
    <div class="home-star home-star-two">✧</div>
    <div class="home-star home-star-three">✦</div>


    <!-- HEADER -->
    <header class="header">

        <img
            src="logo-cio.png.jpeg"
            alt="CIO Creative In One"
            class="logo"
        >

    </header>


    <!-- HOME -->
    <main class="home-container">

        <div class="home-badge">
            <span>✦</span>
            CREATIVE IN ONE
            <span>✦</span>
        </div>


        <section class="welcome">

            <p class="welcome-small">
                WELCOME TO
            </p>

            <h1>
                <span>CIO</span>
            </h1>

            <h2>
                Creative In One
            </h2>

            <p class="welcome-description">
                Solusi kreatif untuk kebutuhan
                <strong>desain, foto, video,</strong>
                dan <strong>presentasi.</strong>
            </p>

        </section>


        <!-- BUTTON -->
        <section class="home-buttons">

            <a
                href="pesan.html"
                class="main-button"
            >

                <span class="button-icon">
                    ✦
                </span>

                <span class="button-text">
                    Pesan Jasa
                </span>

                <span class="button-arrow">
                    →
                </span>

            </a>


            <a
                href="ambil.html"
                class="main-button"
            >

                <span class="button-icon">
                    📦
                </span>

                <span class="button-text">
                    Ambil Pesanan
                </span>

                <span class="button-arrow">
                    →
                </span>

            </a>

        </section>


        <!-- LAYANAN -->
        <section class="home-services">

            <div class="service-mini">
                <span>🎬</span>
                <small>VIDEO</small>
            </div>

            <div class="service-mini">
                <span>📷</span>
                <small>FOTO</small>
            </div>

            <div class="service-mini">
                <span>📊</span>
                <small>PPT</small>
            </div>

            <div class="service-mini">
                <span>🎨</span>
                <small>POSTER</small>
            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <span>✦</span>

        Pesan mudah • Proses cepat • Hasil kreatif

        <span>✦</span>

        <br><br>

        <span>✦</span>

        CIO — Creative In One

        <span>✦</span>

    </footer>

</div>

</body>
</html>
