<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CIO Creative In One — layanan editing video, foto, PPT, dan desain poster."
    >

    <title>CIO — Creative In One</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="page home-page">


        <!-- =========================================
             ORNAMEN
        ========================================== -->

        <div class="home-orb home-orb-one"></div>

        <div class="home-orb home-orb-two"></div>

        <div class="home-star home-star-one">
            ✦
        </div>

        <div class="home-star home-star-two">
            ✧
        </div>

        <div class="home-star home-star-three">
            ✦
        </div>


        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="header">

            <img
                src="logo-cio.png.jpeg"
                alt="Logo CIO Creative In One"
                class="logo"
            >

        </header>


        <!-- =========================================
             MAIN
        ========================================== -->

        <main class="home-container">


            <!-- BADGE -->

            <div class="home-badge">

                <span>✦</span>

                CREATIVE IN ONE

                <span>✦</span>

            </div>


            <!-- WELCOME -->

            <section class="welcome">

                <p class="welcome-label">
                    WELCOME TO
                </p>

                <h1>
                    <span>CIO</span>
                </h1>

                <h2>
                    Creative In One
                </h2>

                <p>
                    Solusi kreatif untuk kebutuhan
                    <strong>desain, foto, video,</strong>
                    dan <strong>presentasi.</strong>
                </p>

            </section>


            <!-- =====================================
                 BUTTON UTAMA
            ====================================== -->

            <section class="home-buttons">


                <!-- PESAN JASA -->

                <a
                    href="pesan.html"
                    class="main-button"
                >

                    <span class="button-icon">
                        ✦
                    </span>

                    <span>
                        Pesan Jasa
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </a>


                <!-- AMBIL PESANAN -->

                <a
                    href="ambil.html"
                    class="main-button"
                >

                    <span class="button-icon">
                        📦
                    </span>

                    <span>
                        Ambil Pesanan
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </a>


            </section>


            <!-- =====================================
                 INFO SERVICE
            ====================================== -->

            <section class="home-info">


                <!-- VIDEO -->

                <div class="info-item">

                    <div class="info-icon">
                        🎬
                    </div>

                    <span>
                        Edit Video
                    </span>

                </div>


                <!-- FOTO -->

                <div class="info-item">

                    <div class="info-icon">
                        📷
                    </div>

                    <span>
                        Edit Foto
                    </span>

                </div>


                <!-- PPT -->

                <div class="info-item">

                    <div class="info-icon">
                        📊
                    </div>

                    <span>
                        PPT
                    </span>

                </div>


                <!-- POSTER -->

                <div class="info-item">

                    <div class="info-icon">
                        🎨
                    </div>

                    <span>
                        Poster
                    </span>

                </div>


            </section>


        </main>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer>

            <span>✦</span>

            Pesan mudah • Proses cepat • Hasil kreatif

            <span>✦</span>

            <br><br>

            <span>✦</span>

            CIO — Creative In One

            <span>✦</span>

        </footer>


    </div>


</body>

</html>
