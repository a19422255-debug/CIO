<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CIO — Creative In One</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="page home-page">

    <!-- ORNAMEN -->

    <div class="home-orb home-orb-one"></div>
    <div class="home-orb home-orb-two"></div>

    <div class="home-star home-star-one">✦</div>
    <div class="home-star home-star-two">✧</div>
    <div class="home-star home-star-three">✦</div>


    <!-- HEADER -->

    <header class="header">

        <img
            src="logo-cio.png.jpeg"
            alt="CIO Creative In One"
            class="logo"
        >

    </header>


    <!-- CONTENT -->

    <main class="home-container">

        <div class="home-badge">

            <span>✦</span>

            CREATIVE IN ONE

            <span>✦</span>

        </div>


        <div class="welcome">

            <p>
                WELCOME TO
            </p>

            <h1>
                <span>CIO</span>
            </h1>

            <h2>
                Creative In One
            </h2>

            <p>
                Solusi kreatif untuk kebutuhan
                desain, foto, video, dan presentasi.
            </p>

        </div>


        <!-- BUTTONS -->

        <div class="home-buttons">


            <!-- PESAN JASA -->

            <a
                href="pesan.html"
                class="main-button"
            >

                <span class="button-icon">
                    ✦
                </span>

                <span>
                    Pesan Jasa
                </span>

                <span class="button-arrow">
                    →
                </span>

            </a>


            <!-- AMBIL PESANAN -->

            <a
                href="ambil.html"
                class="main-button"
                style="margin-top: 12px;"
            >

                <span class="button-icon">
                    📦
                </span>

                <span>
                    Ambil Pesanan
                </span>

                <span class="button-arrow">
                    →
                </span>

            </a>

        </div>


        <!-- INFO -->

        <div class="home-info">

            <div class="info-item">

                <div class="info-icon">
                    🎬
                </div>

                <span>
                    Video
                </span>

            </div>


            <div class="info-item">

                <div class="info-icon">
                    📷
                </div>

                <span>
                    Foto
                </span>

            </div>


            <div class="info-item">

                <div class="info-icon">
                    🎨
                </div>

                <span>
                    Poster
                </span>

            </div>


            <div class="info-item">

                <div class="info-icon">
                    📊
                </div>

                <span>
                    PPT
                </span>

            </div>

        </div>


    </main>


    <!-- FOOTER -->

    <footer>

        <span>✦</span>

        Pesan mudah • Proses cepat • Hasil kreatif

        <span>✦</span>

        <br><br>

        <span>✦</span>

        <span>✦</span>
