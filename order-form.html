```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order — CIO Creative In One</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #061a32;
            color: #f5f1e8;
            overflow-x: hidden;
        }

        .page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(212, 175, 55, .10),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(212, 175, 55, .08),
                    transparent 25%
                ),
                #061a32;
        }

        /* ORNAMEN */

        .orb {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 1px solid rgba(212, 175, 55, .13);
            border-radius: 50%;
            pointer-events: none;
        }

        .orb-one {
            top: -130px;
            left: -120px;
        }

        .orb-two {
            right: -130px;
            bottom: -130px;
        }

        .star {
            position: absolute;
            color: #d4af37;
            opacity: .55;
            pointer-events: none;
        }

        .star-one {
            top: 190px;
            left: 8%;
            font-size: 22px;
        }

        .star-two {
            top: 360px;
            right: 8%;
            font-size: 17px;
        }

        .star-three {
            bottom: 150px;
            left: 13%;
            font-size: 13px;
        }

        /* HEADER */

        .header {
            position: relative;
            z-index: 5;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px 20px 5px;
        }

        .logo {
            display: block;
            width: 78px;
            height: 78px;
            object-fit: contain;
            border-radius: 50%;
        }

        /* CONTAINER */

        .order-container {
            position: relative;
            z-index: 3;

            width: min(92%, 650px);
            margin: 0 auto;
            padding: 15px 0 45px;
        }

        /* TITLE */

        .order-title {
            margin: 20px auto 25px;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 7px 14px;

            border: 1px solid rgba(212, 175, 55, .45);
            border-radius: 50px;

            color: #d4af37;
            font-size: 9px;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .order-title h1 {
            margin-top: 17px;
            color: #d4af37;
            font-size: clamp(28px, 6vw, 35px);
            line-height: 1.15;
        }

        .order-title p {
            margin-top: 8px;
            color: #9aa7b8;
            font-size: 13px;
            line-height: 1.5;
        }

        /* CARD */

        .order-card {
            width: 100%;
            padding: 25px;

            border: 1px solid rgba(212, 175, 55, .30);
            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #0d2b4d,
                    #081d36
                );

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .25);
        }

        /* PAKET */

        .selected-package {
            margin-bottom: 22px;
            padding: 17px;

            border: 1px solid rgba(212, 175, 55, .18);
            border-radius: 12px;

            background: rgba(4, 17, 33, .45);
        }

        .selected-package-label {
            display: block;
            margin-bottom: 6px;

            color: #8997a9;
            font-size: 9px;
            letter-spacing: 1.5px;
        }

        .selected-package-service {
            color: #d4af37;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .selected-package h2 {
            margin-top: 5px;

            color: #f5f1e8;
            font-size: 20px;
            line-height: 1.25;

            overflow-wrap: anywhere;
        }

        .selected-package-price {
            display: block;
            margin-top: 8px;

            color: #d4af37;
            font-size: 19px;
            font-weight: 700;
        }

        /* FORM */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;

            color: #d4af37;
            font-size: 11px;
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea {
            display: block;

            width: 100%;
            max-width: 100%;

            padding: 12px 13px;

            border: 1px solid rgba(212, 175, 55, .22);
            border-radius: 9px;

            outline: none;

            background: #071a32;
            color: #f5f1e8;

            font-family: inherit;
            font-size: 12px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #627186;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #d4af37;
        }

        .form-group textarea {
            min-height: 115px;
            resize: vertical;
        }

        /* BUTTON */

        .whatsapp-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            margin-top: 10px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #d4af37;
            color: #071a32;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;
            transition: .25s ease;
        }

        .whatsapp-button:hover {
            background: #e4c65a;
            transform: translateY(-2px);
        }

        /* BACK */

        .back-button {
            display: block;

            width: fit-content;
            max-width: 100%;

            margin: 21px auto 0;

            color: #d4af37;
            font-size: 12px;
            text-decoration: none;

            overflow-wrap: anywhere;
        }

        /* FOOTER */

        footer {
            position: relative;
            z-index: 5;

            padding: 18px 15px 25px;

            color: #718095;
            font-size: 10px;

            text-align: center;
            line-height: 1.7;
        }

        footer span {
            margin: 0 4px;
            color: #d4af37;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                padding-top: 18px;
            }

            .logo {
                width: 68px;
                height: 68px;
            }

            .order-container {
                width: 90%;
                padding-top: 8px;
            }

            .order-title {
                margin-top: 18px;
            }

            .order-title h1 {
                font-size: 27px;
            }

            .order-title p {
                font-size: 12px;
            }

            .order-card {
                padding: 20px 15px;
                border-radius: 15px;
            }

            .selected-package {
                padding: 14px;
            }

            .selected-package h2 {
                font-size: 18px;
            }

            .selected-package-price {
                font-size: 17px;
            }

            .form-group input,
            .form-group textarea {
                font-size: 12px;
            }

            .whatsapp-button {
                padding: 14px 10px;
                font-size: 12px;
            }
        }

        /* HP KECIL */

        @media (max-width: 380px) {

            .order-container {
                width: 92%;
            }

            .order-title h1 {
                font-size: 25px;
            }

            .order-card {
                padding: 17px 13px;
            }

            .selected-package h2 {
                font-size: 17px;
            }
        }

        @media (hover: none) {

            .whatsapp-button:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- ORNAMEN -->

    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>

    <div class="star star-one">✦</div>
    <div class="star star-two">✧</div>
    <div class="star star-three">✦</div>


    <!-- HEADER -->

    <header class="header">

        <a href="index.html">
            <img
                src="logo-cio.png.jpeg"
                alt="CIO Creative In One"
                class="logo"
            >
        </a>

    </header>


    <!-- ORDER -->

    <main class="order-container">

        <div class="order-title">

            <div class="badge">
                ✦ CIO CREATIVE ✦
            </div>

            <h1>Order Jasa</h1>

            <p>
                Lengkapi data pesananmu di bawah.
            </p>

        </div>


        <section class="order-card">

            <!-- PAKET YANG DIPILIH -->

            <div class="selected-package">

                <span class="selected-package-label">
                    PAKET YANG DIPILIH
                </span>

                <div
                    class="selected-package-service"
                    id="serviceName"
                >
                    JASA
                </div>

                <h2 id="packageName">
                    Memuat paket...
                </h2>

                <strong
                    class="selected-package-price"
                    id="packagePrice"
                >
                    -
                </strong>

            </div>


            <!-- FORM -->

            <form id="orderForm">

                <div class="form-group">

                    <label for="nama">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama kamu"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="whatsapp">
                        Nomor WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        placeholder="08xxxxxxxxxx"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="catatan">
                        Detail Pesanan
                    </label>

                    <textarea
                        id="catatan"
                        placeholder="Jelaskan konsep, ukuran, durasi, atau kebutuhan lainnya..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="whatsapp-button"
                >
                    💬 Kirim Pesanan ke WhatsApp
                </button>

            </form>


            <a
                href="pesan.html"
                class="back-button"
            >
                ← Kembali ke Pilih Jasa
            </a>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        ✦ <span>CIO</span> — Creative In One ✦
    </footer>

</div>


<script>

    /* =========================================
       BACA DATA DARI LINK
    ========================================= */

    const params = new URLSearchParams(
        window.location.search
    );

    const jasa =
        params.get("jasa") || "Jasa";

    const paket =
        params.get("paket") || "Paket";

    const harga =
        params.get("harga") || "-";


    /* =========================================
       TAMPILKAN DATA PAKET
    ========================================= */

    document.getElementById("serviceName")
        .textContent = jasa;

    document.getElementById("packageName")
        .textContent = paket;

    document.getElementById("packagePrice")
        .textContent = harga;


    /* =========================================
       FORM → WHATSAPP CEO
    ========================================= */

    document.getElementById("orderForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const nama =
                document.getElementById("nama")
                    .value
                    .trim();


            const whatsapp =
                document.getElementById("whatsapp")
                    .value
                    .trim();


            const catatan =
                document.getElementById("catatan")
                    .value
                    .trim();


            /* =====================================
               NOMOR WHATSAPP CEO CIO
               +62 856-4504-5260
               ===================================== */

            const nomorCIO = "6285645045260";


            /* =====================================
               PESAN OTOMATIS
               ===================================== */

            const pesan =
`Halo CIO Creative In One 👋

Saya ingin memesan jasa:

Jasa: ${jasa}
Paket: ${paket}
Harga: ${harga}

Nama: ${nama}
Nomor WhatsApp: ${whatsapp}

Detail Pesanan:
${catatan}

Terima kasih 🙏`;


            /* =====================================
               LINK WHATSAPP
               ===================================== */

            const whatsappURL =
                "https://wa.me/" +
                nomorCIO +
                "?text=" +
                encodeURIComponent(pesan);


            /* =====================================
               LANGSUNG BUKA WHATSAPP
               ===================================== */

            window.location.href = whatsappURL;

        });

</script>

</body>
</html>
```
